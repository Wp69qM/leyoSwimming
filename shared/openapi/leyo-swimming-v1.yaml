openapi: 3.0.3
info:
  title: leyoSwimming API
  description: 游泳私教预约平台后端 API 契约（登录注册批次）
  version: 1.0.0
  contact:
    name: leyoSwimming Team

servers:
  - url: http://localhost:8080
    description: 本地开发环境

paths:
  /api/v1/auth/wechat-login:
    post:
      tags:
        - Auth
      summary: 微信一键登录
      description: |
        用户端 / 教练端共用接口。
        请求中需携带 `app_type=user` 或 `app_type=coach`，后端分别写入/查询 `users` 表或 `coaches` 表。
      operationId: wechatLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWechatLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/phone-code-login:
    post:
      tags:
        - Auth
      summary: 手机号验证码登录
      description: 用户端 / 教练端手机号验证码登录。
      operationId: phoneCodeLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/auth/send-phone-code:
    post:
      tags:
        - Auth
      summary: 发送手机验证码
      description: 向指定手机号发送短信验证码，验证码存入 Redis TTL。
      operationId: sendPhoneCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPhoneCodeRequest'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/v1/admin/auth/login:
    post:
      tags:
        - Admin Auth
      summary: 管理员账号密码登录
      description: Web 管理后台登录接口，返回管理员 JWT。
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminLoginResponse'

  /api/coach/application:
    get:
      tags:
        - Coach Application
      summary: 查询教练入驻资料
      description: 供已登录教练查询当前入驻资料，包含证书列表与提示信息。
      operationId: getCoachApplication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Coach Application
      summary: 提交教练入驻资料
      description: 首次提交、已驳回重新提交、已离职重新入驻均调用本接口。
      operationId: submitCoachApplication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachApplicationRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/coach/application/draft:
    put:
      tags:
        - Coach Application
      summary: 保存教练入驻资料草稿
      description: 保存草稿，不触发审核状态变更。
      operationId: saveCoachApplicationDraft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachApplicationRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object

    ApiResponseVoid:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: 'null'

    ApiResponseWechatLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WechatLoginResponse'

    ApiResponseTokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenResponse'

    ApiResponseAdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminLoginResponse'

    ApiResponseCoachApplicationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CoachApplicationResponse'

    WechatLoginRequest:
      type: object
      required:
        - app_type
        - code
      properties:
        app_type:
          type: string
          enum: [user, coach]
          description: 登录端类型
        code:
          type: string
          description: 微信登录临时 code
        invited_by:
          type: string
          nullable: true
          description: 邀请人 ID（可选）

    WechatLoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 7200
        is_new_user:
          type: boolean
        coach_status:
          type: integer
          nullable: true
          description: 教练端登录时返回，-1/0/1/2/3/4
        redirect_page:
          type: string
          nullable: true
          description: 已废弃，前端根据 coach_status 自行判断

    PhoneCodeLoginRequest:
      type: object
      required:
        - phone
        - code
        - app_type
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        code:
          type: string
          minLength: 4
          maxLength: 6
        app_type:
          type: string
          enum: [user, coach]

    SendPhoneCodeRequest:
      type: object
      required:
        - phone
        - app_type
        - scene
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        app_type:
          type: string
          enum: [user, coach]
        scene:
          type: string
          enum: [login, bind_phone, reset_password]

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 7200

    AdminLoginRequest:
      type: object
      required:
        - username
        - password
        - captcha
      properties:
        username:
          type: string
        password:
          type: string
        captcha:
          type: string

    AdminLoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          example: 7200
        admin_name:
          type: string
        roles:
          type: array
          items:
            type: string

    CoachApplicationRequest:
      type: object
      required:
        - name
        - id_card_no
        - teaching_years
        - reference_price
        - teaching_strokes
        - bio
        - certificates
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        id_card_no:
          type: string
        teaching_years:
          type: integer
          minimum: 0
        total_students:
          type: integer
          minimum: 0
        total_hours:
          type: integer
          minimum: 0
        teaching_strokes:
          type: array
          items:
            type: string
        bio:
          type: string
          maxLength: 500
        reference_price:
          type: number
          minimum: 0
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/CertificateDTO'

    CertificateDTO:
      type: object
      required:
        - cert_type
        - image_url
      properties:
        cert_type:
          type: string
          enum: [ID_CARD_FRONT, ID_CARD_BACK, COACH_CERT, HEALTH_CERT, PORTRAIT]
        image_url:
          type: string
          format: uri

    CoachApplicationResponse:
      type: object
      properties:
        coach_id:
          type: integer
        name:
          type: string
        avatar_url:
          type: string
          nullable: true
        phone:
          type: string
        id_card_no:
          type: string
        teaching_years:
          type: integer
        total_students:
          type: integer
        total_hours:
          type: integer
        teaching_strokes:
          type: array
          items:
            type: string
        bio:
          type: string
        reference_price:
          type: number
        status:
          type: integer
          description: '-1 未提交 / 0 待审核 / 1 已通过 / 2 已驳回 / 3 已离职 / 4 申请离职中'
        submitted_at:
          type: string
          format: date-time
          nullable: true
        rejection_reason:
          type: string
          nullable: true
        entry_type:
          type: string
          enum: [first, rejected, reapply]
        prompt_message:
          type: string
          nullable: true
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/CertificateDTO'

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 400001
            message: 请求参数错误
            data: null

    Unauthorized:
      description: 未授权或 token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 401001
            message: 登录已过期，请重新登录
            data: null

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 404001
            message: 资源不存在
            data: null

    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 409001
            message: 已有待审核申请
            data: null
