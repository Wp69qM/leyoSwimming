openapi: 3.0.3
info:
  title: leyoSwimming API
  description: 游泳私教预约平台后端 API 契约（登录注册批次）
  version: 1.0.0
  contact:
    name: leyoSwimming Team

servers:
  - url: http://localhost:8080
    description: 本地开发环境

paths:
  /api/auth/wechatLogin:
    post:
      tags:
        - Auth
      summary: 微信一键登录
      description: |
        用户端 / 教练端共用接口。
        请求中需携带 `appType=user` 或 `appType=coach`，后端分别写入/查询 `users` 表或 `coaches` 表。
      operationId: wechatLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWechatLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/phoneCodeLogin:
    post:
      tags:
        - Auth
      summary: 手机号验证码登录
      description: 用户端 / 教练端手机号验证码登录。
      operationId: phoneCodeLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/sendPhoneCode:
    post:
      tags:
        - Auth
      summary: 发送手机验证码
      description: 向指定手机号发送短信验证码，验证码存入 Redis TTL。
      operationId: sendPhoneCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPhoneCodeRequest'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/admin/auth/login:
    post:
      tags:
        - Admin Auth
      summary: 管理员账号密码登录
      description: Web 管理后台登录接口，返回管理员 JWT。
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/auth/logout:
    post:
      tags:
        - Admin Auth
      summary: 管理员退出登录
      description: 失效当前管理员会话 token。
      operationId: adminLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coach/application/detail:
    post:
      tags:
        - Coach Application
      summary: 查询教练入驻资料
      description: 供已登录教练查询当前入驻资料，包含证书列表与提示信息。
      operationId: getCoachApplication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/coach/application/submit:
    post:
      tags:
        - Coach Application
      summary: 提交教练入驻资料
      description: 首次提交、已驳回重新提交、已离职重新入驻均调用本接口。
      operationId: submitCoachApplication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachApplicationSubmitRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/coach/application/saveDraft:
    post:
      tags:
        - Coach Application
      summary: 保存教练入驻资料草稿
      description: 保存草稿，不触发审核状态变更。
      operationId: saveCoachApplicationDraft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachApplicationSaveDraftRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object

    ApiResponseVoid:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true

    ApiResponseWechatLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WechatLoginResponse'

    ApiResponseTokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenResponse'

    ApiResponseAdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminLoginResponse'

    ApiResponseCoachApplicationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CoachApplicationResponse'

    WechatLoginRequest:
      type: object
      required:
        - appType
        - code
      properties:
        appType:
          type: string
          enum: [user, coach]
          description: 登录端类型
        code:
          type: string
          description: 微信登录临时 code
        invitedBy:
          type: string
          nullable: true
          description: 邀请人 ID（可选）

    WechatLoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 7200
        isNewUser:
          type: boolean
        coachStatus:
          type: integer
          nullable: true
          description: 教练端登录时返回，-1/0/1/2/3/4

    PhoneCodeLoginRequest:
      type: object
      required:
        - phone
        - code
        - appType
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        code:
          type: string
          minLength: 4
          maxLength: 6
        appType:
          type: string
          enum: [user, coach]

    SendPhoneCodeRequest:
      type: object
      required:
        - phone
        - appType
        - scene
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        appType:
          type: string
          enum: [user, coach]
        scene:
          type: string
          enum: [login, bind_phone, reset_password]

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 7200

    AdminLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    AdminLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 管理员会话 token（JWT），有效期 24 小时
        expiresIn:
          type: integer
          example: 86400
          description: token 有效期（秒）
        admin:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            name:
              type: string
            role:
              type: string

    CoachApplicationForm:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        idCardNo:
          type: string
        teachingYears:
          type: integer
          minimum: 0
        totalStudents:
          type: integer
          minimum: 0
        totalHours:
          type: integer
          minimum: 0
        teachingStrokes:
          type: array
          items:
            type: string
        bio:
          type: string
          maxLength: 500
        referencePrice:
          type: number
          minimum: 0
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/CertificateDto'

    CoachApplicationSubmitRequest:
      allOf:
        - $ref: '#/components/schemas/CoachApplicationForm'
        - type: object
          required:
            - name
            - idCardNo
            - teachingYears
            - referencePrice
            - teachingStrokes
            - bio
            - certificates
          properties:
            idempotentKey:
              type: string
              description: 幂等键，建议客户端生成 UUID

    CoachApplicationSaveDraftRequest:
      allOf:
        - $ref: '#/components/schemas/CoachApplicationForm'
        - type: object
          properties:
            idempotentKey:
              type: string
              description: 幂等键，建议客户端生成 UUID

    CertificateDto:
      type: object
      required:
        - certType
        - imageUrl
      properties:
        certType:
          type: string
          enum: [ID_CARD_FRONT, ID_CARD_BACK, COACH_CERT, HEALTH_CERT, PORTRAIT]
        imageUrl:
          type: string
          format: uri

    CoachApplicationResponse:
      type: object
      properties:
        coachId:
          type: integer
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        phone:
          type: string
        idCardNo:
          type: string
        teachingYears:
          type: integer
        totalStudents:
          type: integer
        totalHours:
          type: integer
        teachingStrokes:
          type: array
          items:
            type: string
        bio:
          type: string
        referencePrice:
          type: number
        status:
          type: integer
          description: '-1 未提交 / 0 待审核 / 1 已通过 / 2 已驳回 / 3 已离职 / 4 申请离职中'
        submittedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        entryType:
          type: string
          enum: [first, rejected, reapply]
        promptMessage:
          type: string
          nullable: true
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/CertificateDto'

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 100001
            message: 请求参数错误
            data: null

    Unauthorized:
      description: 未授权或 token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 200001
            message: 登录已过期，请重新登录
            data: null

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 100002
            message: 资源不存在
            data: null

    Forbidden:
      description: 权限禁止或账号被禁用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 300001
            message: 账号已被禁用，请联系超级管理员
            data: null

    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 500001
            message: 已有待审核申请
            data: null
