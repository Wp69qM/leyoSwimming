components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: success
        data:
          type: object

    ApiResponseVoid:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              type: object
              nullable: true

    ApiResponseWechatLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/WechatLoginResponse'

    ApiResponseTokenResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenResponse'

    ApiResponseAdminLoginResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AdminLoginResponse'

    ApiResponseCoachApplicationResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CoachApplicationResponse'

    WechatLoginRequest:
      type: object
      required:
        - appType
        - code
      properties:
        appType:
          type: string
          enum: [user, coach]
          description: 登录端类型
        code:
          type: string
          description: 微信登录临时 code
        invitedBy:
          type: string
          nullable: true
          description: 邀请人 ID（可选）

    WechatLoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 7200
        isNewUser:
          type: boolean
        coachStatus:
          type: integer
          nullable: true
          description: 教练端登录时返回，-1/0/1/2/3/4

    PhoneCodeLoginRequest:
      type: object
      required:
        - phone
        - code
        - appType
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        code:
          type: string
          minLength: 4
          maxLength: 6
        appType:
          type: string
          enum: [user, coach]

    SendPhoneCodeRequest:
      type: object
      required:
        - phone
        - appType
        - scene
      properties:
        phone:
          type: string
          pattern: '^1[3-9]\d{9}$'
        appType:
          type: string
          enum: [user, coach]
        scene:
          type: string
          enum: [login, bind_phone, reset_password]

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 7200

    AdminLoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    AdminLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: 管理员会话 token（JWT），有效期 24 小时
        expiresIn:
          type: integer
          example: 86400
          description: token 有效期（秒）
        admin:
          type: object
          properties:
            id:
              type: integer
            username:
              type: string
            name:
              type: string
            role:
              type: string

    CoachApplicationForm:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 32
        idCardNo:
          type: string
        teachingYears:
          type: integer
          minimum: 0
        totalStudents:
          type: integer
          minimum: 0
        totalHours:
          type: integer
          minimum: 0
        teachingStrokes:
          type: array
          items:
            type: string
        bio:
          type: string
          maxLength: 500
        referencePrice:
          type: number
          minimum: 0
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/CertificateDto'

    CoachApplicationSubmitRequest:
      allOf:
        - $ref: '#/components/schemas/CoachApplicationForm'
        - type: object
          required:
            - name
            - idCardNo
            - teachingYears
            - referencePrice
            - teachingStrokes
            - bio
            - certificates
          properties:
            idempotentKey:
              type: string
              description: 幂等键，建议客户端生成 UUID

    CoachApplicationSaveDraftRequest:
      allOf:
        - $ref: '#/components/schemas/CoachApplicationForm'
        - type: object
          properties:
            idempotentKey:
              type: string
              description: 幂等键，建议客户端生成 UUID

    CertificateDto:
      type: object
      required:
        - certType
        - imageUrl
      properties:
        certType:
          type: string
          enum: [ID_CARD_FRONT, ID_CARD_BACK, COACH_CERT, HEALTH_CERT, PORTRAIT]
        imageUrl:
          type: string
          format: uri

    CoachApplicationResponse:
      type: object
      properties:
        coachId:
          type: integer
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        phone:
          type: string
        idCardNo:
          type: string
        teachingYears:
          type: integer
        totalStudents:
          type: integer
        totalHours:
          type: integer
        teachingStrokes:
          type: array
          items:
            type: string
        bio:
          type: string
        referencePrice:
          type: number
        status:
          type: integer
          description: '-1 未提交 / 0 待审核 / 1 已通过 / 2 已驳回 / 3 已离职 / 4 申请离职中'
        submittedAt:
          type: string
          format: date-time
          nullable: true
        rejectionReason:
          type: string
          nullable: true
        entryType:
          type: string
          enum: [first, rejected, reapply]
        promptMessage:
          type: string
          nullable: true
        certificates:
          type: array
          items:
            $ref: '#/components/schemas/CertificateDto'

    PaginationRequest:
      type: object
      properties:
        page:
          type: integer
          default: 1
          minimum: 1
        pageSize:
          type: integer
          default: 10
          minimum: 1
          maximum: 50

    CoachListRequest:
      $ref: '#/components/schemas/PaginationRequest'

    CoachListItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: integer
        avatar:
          type: string
        rating:
          type: number
        yearsOfTeaching:
          type: integer
        teachingStrokes:
          type: array
          items:
            type: string
        realTimeStatus:
          type: string

    CoachListPageResponse:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoachListItem'

    ApiResponseCoachListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/CoachListPageResponse'

    CoachDetailRequest:
      type: object
      required:
        - coachId
      properties:
        coachId:
          type: integer

    CoachDetailContact:
      type: object
      properties:
        phone:
          type: string
        wechatQrCode:
          type: string

    CoachDetailCertificate:
      type: object
      properties:
        name:
          type: string
        level:
          type: string

    CoachDetailPackage:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
        hours:
          type: integer

    CoachReview:
      type: object
      properties:
        id:
          type: integer
        rating:
          type: number
        content:
          type: string
        createdAt:
          type: string
          format: date-time

    TimeSlot:
      type: object
      properties:
        startTime:
          type: string
        endTime:
          type: string

    AvailableTime:
      type: object
      properties:
        date:
          type: string
          format: date
        slots:
          type: array
          items:
            $ref: '#/components/schemas/TimeSlot'

    CoachDetailResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        gender:
          type: integer
        age:
          type: integer
        status:
          type: integer
        avatar:
          type: string
        rating:
          type: number
        yearsOfTeaching:
          type: integer
        totalStudents:
          type: integer
        totalHours:
          type: integer
        teachingStrokes:
          type: array
          items:
            type: string
        bio:
          type: string
        referencePrice:
          type: integer
        contact:
          $ref: '#/components/schemas/CoachDetailContact'
        certificates:
