  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 100001
            message: 请求参数错误
            data: null

    Unauthorized:
      description: 未授权或 token 失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 200001
            message: 登录已过期，请重新登录
            data: null

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 100002
            message: 资源不存在
            data: null

    Forbidden:
      description: 权限禁止或账号被禁用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 300001
            message: 账号已被禁用，请联系超级管理员
            data: null

    Conflict:
      description: 资源冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 500001
            message: 已有待审核申请
            data: null
