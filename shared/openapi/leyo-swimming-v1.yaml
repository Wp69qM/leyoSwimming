openapi: 3.0.3
info:
  title: leyoSwimming API
  description: 游泳私教预约平台后端 API 契约（登录注册 + 套餐购买订单退款批次）
  version: 1.1.0
  contact:
    name: leyoSwimming Team

tags:
  - name: Auth
  - name: Admin Auth
  - name: Coach Application
  - name: Coach
  - name: Package
  - name: Order
  - name: Payment
  - name: Admin Package
  - name: Admin Order
  - name: Admin Package Template
  - name: Image Upload

servers:
  - url: http://localhost:8080
    description: 本地开发环境

paths:
  /api/auth/wechatLogin:
    post:
      tags:
        - Auth
      summary: 微信一键登录
      description: |
        用户端 / 教练端共用接口。
        请求中需携带 `appType=user` 或 `appType=coach`，后端分别写入/查询 `users` 表或 `coaches` 表。
      operationId: wechatLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WechatLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseWechatLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/phoneCodeLogin:
    post:
      tags:
        - Auth
      summary: 手机号验证码登录
      description: 用户端 / 教练端手机号验证码登录。
      operationId: phoneCodeLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneCodeLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseTokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/sendPhoneCode:
    post:
      tags:
        - Auth
      summary: 发送手机验证码
      description: 向指定手机号发送短信验证码，验证码存入 Redis TTL。
      operationId: sendPhoneCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendPhoneCodeRequest'
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/admin/auth/login:
    post:
      tags:
        - Admin Auth
      summary: 管理员账号密码登录
      description: Web 管理后台登录接口，返回管理员 JWT。
      operationId: adminLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAdminLoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/auth/logout:
    post:
      tags:
        - Admin Auth
      summary: 管理员退出登录
      description: 失效当前管理员会话 token。
      operationId: adminLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coach/application/detail:
    post:
      tags:
        - Coach Application
      summary: 查询教练入驻资料
      description: 供已登录教练查询当前入驻资料，包含证书列表与提示信息。
      operationId: getCoachApplication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/coach/application/submit:
    post:
      tags:
        - Coach Application
      summary: 提交教练入驻资料
      description: 首次提交、已驳回重新提交、已离职重新入驻均调用本接口。
      operationId: submitCoachApplication
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachApplicationSubmitRequest'
      responses:
        '200':
          description: 提交成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/coach/application/saveDraft:
    post:
      tags:
        - Coach Application
      summary: 保存教练入驻资料草稿
      description: 保存草稿，不触发审核状态变更。
      operationId: saveCoachApplicationDraft
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachApplicationSaveDraftRequest'
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseVoid'

  /api/coach/list:
    post:
      tags:
        - Coach
      summary: 教练列表查询
      description: 游客可访问，支持分页。
      operationId: listCoaches
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/coach/detail:
    post:
      tags:
        - Coach
      summary: 教练详情查询
      description: 游客可访问。错误码：COACH_NOT_FOUND
      operationId: getCoachDetail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachDetailRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/order/trial:
    post:
      tags:
        - Order
      summary: 购买体验课套餐
      description: 创建体验课订单。错误码：AGREEMENT_REQUIRED, TRIAL_PACKAGE_EXISTS, COACH_UNAVAILABLE, TRIAL_PACKAGE_INACTIVE
      operationId: createTrialOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderTrialRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderTrialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/order/pay:
    post:
      tags:
        - Payment
      summary: 支付套餐订单
      description: 发起支付。错误码：ORDER_NOT_FOUND, ORDER_NOT_PAYABLE, ORDER_EXPIRED, INVALID_CHANNEL
      operationId: payOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPayRequest'
      responses:
        '200':
          description: 支付结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderPayResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/payment/mock-callback:
    post:
      tags:
        - Payment
      summary: 支付 Mock 回调
      description: 模拟第三方支付回调，用于开发/测试环境。
      operationId: mockPaymentCallback
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMockCallbackRequest'
      responses:
        '200':
          description: 回调结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePaymentMockCallbackResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/agreement/status:
    post:
      tags:
        - Order
      summary: 查询协议签署状态
      description: 返回用户协议、健康声明、免责声明的签署状态。
      operationId: getAgreementStatus
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgreementStatusRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseAgreementStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/package/list:
    post:
      tags:
        - Package
      summary: 正价套餐列表查询
      description: 游客可浏览平台标准套餐列表。
      operationId: listPackages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePackageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/coach/package/list:
    post:
      tags:
        - Coach
      summary: 教练关联套餐列表查询
      description: 查询某教练可售的标准套餐与自定义课包配置。错误码：COACH_NOT_FOUND
      operationId: listCoachPackages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachPackageListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachPackageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/package/detail:
    post:
      tags:
        - Package
      summary: 套餐详情查询
      description: 查询套餐详情及适用教练。错误码：PACKAGE_NOT_FOUND
      operationId: getPackageDetail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageDetailRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePackageDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/order/formal:
    post:
      tags:
        - Order
      summary: 购买正价套餐
      description: 创建正式课订单。错误码：AGREEMENT_REQUIRED, COACH_CONFLICT, COACH_UNAVAILABLE, GUARDIAN_PHONE_REQUIRED, PACKAGE_NOT_AVAILABLE, INVALID_CUSTOM_PACKAGE_CONFIG, INVALID_HOURS
      operationId: createFormalOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderFormalRequest'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderFormalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/guardian/verify:
    post:
      tags:
        - Order
      summary: 监护人手机号校验
      description: MVP 阶段仅校验 guardianPhone 已填写。错误码：GUARDIAN_PHONE_REQUIRED, INVALID_VERIFICATION_CODE
      operationId: verifyGuardian
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardianVerifyRequest'
      responses:
        '200':
          description: 校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseGuardianVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/user/package/list:
    post:
      tags:
        - Package
      summary: 我的套餐列表
      description: 按状态分组查询当前学员的套餐。
      operationId: listUserPackages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPackageListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserPackageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/coach/package/detail:
    post:
      tags:
        - Coach
      summary: 套餐详情（教练/学员共用）
      description: 查询某个用户套餐的详情与使用记录。错误码：FORBIDDEN, PACKAGE_NOT_FOUND
      operationId: getUserPackageDetail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPackageDetailRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseUserPackageDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/order/detail:
    post:
      tags:
        - Order
      summary: 订单详情
      description: 查询订单详情，返回订单、套餐、教练、支付、退款信息。错误码：ORDER_ACCESS_DENIED, ORDER_NOT_FOUND
      operationId: getOrderDetail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDetailRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/order/list:
    post:
      tags:
        - Order
      summary: 订单列表
      description: 查询当前学员订单列表。
      operationId: listOrders
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseOrderListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/package/refund-check:
    post:
      tags:
        - Order
      summary: 退款资格校验
      description: 检查套餐是否可退款并计算可退金额。错误码：PACKAGE_NOT_FOUND, PACKAGE_ALREADY_REFUNDED, PACKAGE_FROZEN
      operationId: checkPackageRefund
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRefundCheckRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePackageRefundCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/package/refund:
    post:
      tags:
        - Order
      summary: 申请退款
      description: 发起套餐退款申请。错误码：REFUND_IN_PROGRESS, PACKAGE_ALREADY_REFUNDED, PACKAGE_FROZEN, REFUND_NOT_SUPPORTED, REFUND_EXPIRED, PACKAGE_EXHAUSTED_NOT_REFUNDABLE
      operationId: applyPackageRefund
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PackageRefundRequest'
      responses:
        '200':
          description: 申请成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponsePackageRefundResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/coach/student/list:
    post:
      tags:
        - Coach
      summary: 教练查看学员列表
      description: 查询当前教练关联学员，支持 active/history 分组。错误码：AUTH_FORBIDDEN
      operationId: listCoachStudents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachStudentListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachStudentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/coach/student/detail:
    post:
      tags:
        - Coach
      summary: 教练查看学员资料
      description: 查询指定学员的完整资料。错误码：NOT_ASSOCIATED_STUDENT
      operationId: getCoachStudentDetail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachStudentDetailRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachStudentDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/coach/student/update:
    post:
      tags:
        - Coach
      summary: 教练更新学员资料
      description: 更新教练视角的学员学习档案。错误码：NOT_ASSOCIATED_STUDENT, READONLY_USER_PROFILE, IDEMPOTENCY_DUPLICATE
      operationId: updateCoachStudent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachStudentUpdateRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/coach/student/package/list:
    post:
      tags:
        - Coach
      summary: 教练查看学员套餐列表
      description: 查询某学员在当前教练名下的套餐。错误码：NOT_ASSOCIATED_STUDENT
      operationId: listCoachStudentPackages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoachStudentPackageListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponseCoachStudentPackageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/package/list:
    post:
      tags:
        - Admin Package
      summary: 管理员查看用户套餐列表
      description: 后台管理用户套餐分页查询。错误码：ADMIN_PERMISSION_DENIED
      operationId: listAdminPackages
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPackageListRequest'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminApiResponsePackageListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/package/detail:
    post:
      tags:
        - Admin Package
      summary: 管理员查看用户套餐详情
      description: 查询单个用户套餐的完整信息。错误码：ADMIN_PERMISSION_DENIED, PACKAGE_NOT_FOUND
      operationId: getAdminPackageDetail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
