spring:
  application:
    name: leyo-swimming-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  file:
    upload-dir: uploads
    base-url: /uploads/

mybatis-plus:
  # 自定义 TypeHandler 通过实体字段上的 @TableField(typeHandler = ...) 显式指定。
  # 不注册全局 List 类型处理器，避免 Java 泛型擦除后 StringListJsonTypeHandler
  # 覆盖 CoachCertificateListJsonTypeHandler 导致 coach.certificates 反序列化失败。

logging:
  level:
    root: INFO
    com.leyoswimming: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
