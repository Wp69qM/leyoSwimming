spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:leyo_dev}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:leyo1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:leyo1234}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  global-config:
    db-config:
      table-format: "`%s`"

app:
  file:
    upload-dir: ./uploads
    base-url: http://localhost:8080/uploads/

leyo:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  phone-encryption:
    key: ${PHONE_ENCRYPTION_KEY}
  id-card-encryption:
    key: ${ID_CARD_ENCRYPTION_KEY}
  sms:
    mock-enabled: ${SMS_MOCK_ENABLED:true}
    mock-fixed-code: ${SMS_MOCK_FIXED_CODE:123456}
  wechat:
    mock-enabled: ${WECHAT_MOCK_ENABLED:true}
    appid: ${WECHAT_APPID:wx_mock_appid}
    secret: ${WECHAT_SECRET:wx_mock_secret}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL:http://leyo-ai-service:8000}
    internal-api-token: ${INTERNAL_API_TOKEN:dev-internal-token-must-be-overridden-in-production}
