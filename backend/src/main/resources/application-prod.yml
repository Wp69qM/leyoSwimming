spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:leyo_prod}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

mybatis-plus:
  global-config:
    db-config:
      table-format: "`%s`"

leyo:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:86400000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  phone-encryption:
    key: ${PHONE_ENCRYPTION_KEY}
  id-card-encryption:
    key: ${ID_CARD_ENCRYPTION_KEY}
  sms:
    mock-enabled: ${SMS_MOCK_ENABLED:true}
    mock-fixed-code: ${SMS_MOCK_FIXED_CODE:123456}
  wechat:
    mock-enabled: ${WECHAT_MOCK_ENABLED:true}
  ai-service:
    base-url: ${AI_SERVICE_BASE_URL}
    internal-api-token: ${INTERNAL_API_TOKEN}
