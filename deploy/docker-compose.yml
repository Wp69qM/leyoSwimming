version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: leyo-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-leyo_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-leyo_dev}
      MYSQL_USER: ${MYSQL_USER:-leyo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-leyo_dev}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: leyo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: leyo-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-leyo_dev}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-leyo}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-leyo_dev}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY:-dev-phone-encryption-key-change-in-production}
      ID_CARD_ENCRYPTION_KEY: ${ID_CARD_ENCRYPTION_KEY:-dev-id-card-encryption-key-change-in-production}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: leyo-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JAVA_INTERNAL_BASE_URL: http://leyo-backend:8080/api/internal/ai
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      ENABLE_MOCK_DATA: ${ENABLE_MOCK_DATA:-true}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: leyo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai-service

volumes:
  mysql_data:
  redis_data:
