version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: leyo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 生产环境不暴露端口到宿主机
    # ports:
    #   - "127.0.0.1:3306:3306"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - leyo-network

  redis:
    image: redis:7-alpine
    container_name: leyo-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 生产环境不暴露端口到宿主机
    # ports:
    #   - "127.0.0.1:6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - leyo-network

  backend:
    image: eclipse-temurin:21-jre-alpine
    container_name: leyo-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../leyo-swimming-backend-0.1.0-SNAPSHOT.jar:/app/app.jar:ro
      - ../uploads:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 0
      JWT_SECRET: ${JWT_SECRET}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY}
      ID_CARD_ENCRYPTION_KEY: ${ID_CARD_ENCRYPTION_KEY}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      APP_FILE_UPLOAD_DIR: /app/uploads
      APP_FILE_BASE_URL: http://${DOMAIN}/uploads/
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["java", "-jar", "app.jar"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - leyo-network

  ai-service:
    image: leyo-ai-service:v1.0.0
    container_name: leyo-ai-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      JAVA_INTERNAL_BASE_URL: http://leyo-backend:8080/api/internal/ai
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      SESSION_MESSAGE_TTL_SECONDS: 604800
      SESSION_MAX_MESSAGES: 20
      RATE_LIMIT_USER_PER_MINUTE: 30
      RATE_LIMIT_IP_PER_MINUTE: 60
      TRUSTED_PROXY_COUNT: 1
      ENABLE_MOCK_DATA: ${ENABLE_MOCK_DATA:-false}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - leyo-network

  nginx:
    image: nginx:alpine
    container_name: leyo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web-admin-dist:/usr/share/nginx/html/admin:ro
      - ../h5-user-dist:/usr/share/nginx/html/h5-user-dist:ro
      - ../h5-coach-dist:/usr/share/nginx/html/h5-coach-dist:ro
      - ../uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend
      - ai-service
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - leyo-network

volumes:
  mysql_data:
  redis_data:

networks:
  leyo-network:
    driver: bridge
