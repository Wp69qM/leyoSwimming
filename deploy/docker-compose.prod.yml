version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: leyo-mysql
    restart: unless-stopped
    pull_policy: never
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 生产环境不暴露端口到宿主机
    # ports:
    #   - "127.0.0.1:3306:3306"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - leyo-network

  redis:
    image: redis:7-alpine
    container_name: leyo-redis
    restart: unless-stopped
    pull_policy: never
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    #  AI 服务以 systemd 运行在宿主机，需要访问宿主机的 Redis
    ports:
      - "127.0.0.1:6379:6379"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
    networks:
      - leyo-network

  backend:
    image: eclipse-temurin:21-jre-alpine
    container_name: leyo-backend
    restart: unless-stopped
    pull_policy: never
    working_dir: /app
    volumes:
      - ../leyo-swimming-backend.jar:/app/app.jar:ro
      - ../uploads:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 0
      JWT_SECRET: ${JWT_SECRET}
      PHONE_ENCRYPTION_KEY: ${PHONE_ENCRYPTION_KEY}
      ID_CARD_ENCRYPTION_KEY: ${ID_CARD_ENCRYPTION_KEY}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      SMS_MOCK_ENABLED: ${SMS_MOCK_ENABLED:-true}
      SMS_MOCK_FIXED_CODE: ${SMS_MOCK_FIXED_CODE:-123456}
      WECHAT_MOCK_ENABLED: ${WECHAT_MOCK_ENABLED:-true}
      APP_FILE_UPLOAD_DIR: /app/uploads
      APP_FILE_BASE_URL: http://${DOMAIN}/uploads/
    # 暴露 8080 到宿主机 127.0.0.1，供 systemd 运行的 AI 服务访问内部 API
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["java", "-jar", "app.jar"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - leyo-network

  ai-service:
    image: leyo-ai-service:v1.0.0
    container_name: leyo-ai-service
    restart: unless-stopped
    pull_policy: never
    environment:
      APP_NAME: ${APP_NAME:-leyo-ai-service}
      APP_ENV: ${APP_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-8000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      JAVA_INTERNAL_BASE_URL: http://leyo-backend:8080/api/internal/ai
      LLM_MODEL: ${LLM_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-vl-embedding}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # 联网搜索配置（知识库未命中时兜底）
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS:-3}
      # 知识库向量存储配置
      CHROMA_PERSIST_DIRECTORY: ${CHROMA_PERSIST_DIRECTORY:-/app/data/chroma}
      KNOWLEDGE_SIMILARITY_THRESHOLD: ${KNOWLEDGE_SIMILARITY_THRESHOLD:-0.2}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-leyoSwimming}
      LANGCHAIN_ENDPOINT: ${LANGCHAIN_ENDPOINT:-https://api.smith.langchain.com}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      SESSION_MESSAGE_TTL_SECONDS: ${SESSION_MESSAGE_TTL_SECONDS:-604800}
      SESSION_MAX_MESSAGES: ${SESSION_MAX_MESSAGES:-20}
      RATE_LIMIT_USER_PER_MINUTE: ${RATE_LIMIT_USER_PER_MINUTE:-30}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-60}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      ENABLE_MOCK_DATA: ${ENABLE_MOCK_DATA:-false}
    volumes:
      - ai_service_chroma_data:${CHROMA_PERSIST_DIRECTORY:-/app/data/chroma}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - leyo-network

  nginx:
    image: nginx:alpine
    container_name: leyo-nginx
    restart: unless-stopped
    pull_policy: never
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../web-admin-dist:/usr/share/nginx/html/admin:ro
      - ../h5-user-dist:/usr/share/nginx/html/h5-user-dist:ro
      - ../h5-coach-dist:/usr/share/nginx/html/h5-coach-dist:ro
      - ../uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - leyo-network

volumes:
  mysql_data:
  redis_data:
  ai_service_chroma_data:

networks:
  leyo-network:
    driver: bridge
